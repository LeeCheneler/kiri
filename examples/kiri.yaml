# yaml-language-server: $schema=.kiri/kiri.schema.json

# kiri.yaml — kiri's structured config. LLM endpoints that `llm:` steps
# reference by their `provider:model` id live under `providers:`.
# An API key is only ever a `{ env: <NAME> }` reference to an environment
# variable — a literal key is rejected so secrets never land in git.
providers:
  # Optional ChatGPT subscription access; see the Models & providers docs.
  # Use file credential storage in Codex, then run `codex login`.
  # codex:
  #   type: openai-codex

  # Anthropic's API. The key is read from $ANTHROPIC_API_KEY at run time.
  # A step's `model: anthropic:claude-haiku-4-5` resolves against this entry.
  anthropic:
    type: anthropic
    api_key:
      env: ANTHROPIC_API_KEY

  # A local OpenAI-compatible server (LM Studio, Ollama, vLLM, …). `base_url`
  # is required for this type; a local endpoint usually needs no key. Swap a
  # step to `model: local:<your-model>` to run entirely offline.
  local:
    type: openai-compatible
    base_url: http://localhost:1234/v1

# Model shortcuts and delegates. `shortcuts` are free-form names pinned to
# the top of the session pickers, in config order — the first is the default
# for new sessions. `delegates` set the models delegated workers run, by
# role — quick (mechanical legwork), daily (ordinary work), deep
# (reasoning-heavy) — any subset; with none, workers run the delegating
# session's model.
# models:
#   shortcuts:
#     text:
#       sonnet: anthropic:claude-sonnet-4-5
#       haiku: anthropic:claude-haiku-4-5
#     image:
#       images: openai:gpt-image-1
#   delegates:
#     quick: anthropic:claude-haiku-4-5
#     daily: anthropic:claude-sonnet-4-5
#     deep: anthropic:claude-opus-4-5

# MCP servers whose tools are offered to agentic chat sessions, keyed by name.
# Tools appear in sessions namespaced `<server>__<tool>`.
mcp:
  # A remote Streamable-HTTP server that authenticates with OAuth. With
  # `auth: oauth`, kiri runs the browser sign-in on demand — the server shows a
  # Connect button in the app — and stores the tokens under `.kiri/` (mode 0600,
  # never in git). Tavily provides web search.
  tavily:
    type: http
    url: https://mcp.tavily.com/mcp/
    auth: oauth

  # A remote server that authenticates with a static token instead: the header
  # value is an `{ env: <NAME> }` reference, never a literal.
  # linear:
  #   type: http
  #   url: https://mcp.linear.app/mcp
  #   headers:
  #     Authorization:
  #       env: LINEAR_TOKEN

  # A local server kiri spawns as a subprocess.
  # filesystem:
  #   type: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]

# Working directories for the shell tool offered to agentic sessions.
# Declaring this section is what enables the tool — without it, sessions
# cannot run commands at all. Entries resolve against the workspace root
# ("." is the root itself); absolute paths and a leading ~ work too. Note
# these only confine where a command *runs* — not what it can touch — so
# every call asks for your approval by default.
# shell:
#   working_directories:
#     - .
