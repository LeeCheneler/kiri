# yaml-language-server: $schema=../.kiri/workflow.schema.json

name: Release Notes
description: "Turn a raw change list into polished release notes — first-party llm: steps, no bundle to maintain."

# Every model id below is `provider:model`; the `anthropic:` prefix resolves
# against the `anthropic` entry in this workspace's kiri.yaml. Point
# them at `local:<model>` instead to run against a local server.

steps:
  - sh: |
      # A real workflow would read these from `git log`; kept inline so the
      # example runs anywhere without a repo or extra tools.
      cat <<'CHANGES'
      - add first-party llm: workflow steps
      - render llm model, prompt, and token usage in the run timeline
      - resolve prompt_file paths against the workspace root
      - bump the embedded sqlite driver
      CHANGES
    id: changes
    name: Collect changes

  - llm:
      model: anthropic:claude-haiku-4-5
      # CHANGES is declared under env: as a { step: changes } ref — kiri
      # resolves it to that step's stdout and the prompt reads it by name.
      prompt: |
        Rewrite these raw changelog lines as friendly release notes, grouped
        under "Features" and "Fixes". Keep it tight — one line each.

        {{CHANGES}}
    id: draft
    name: Draft the notes
    description: A first-party completion — kiri calls the model directly, no bundle.
    env:
      CHANGES:
        step: changes

articles:
  - slug: release-notes
    name: Release Notes
    description: The latest changes, written up for humans.
    llm:
      model: anthropic:claude-haiku-4-5
      # Articles entries get no piped stdin — data arrives through env refs.
      # DRAFT resolves to the `draft` step's stdout, and the prompt file
      # reads it as {{DRAFT}}.
      prompt_file: prompts/release-notes.tpl
    env:
      DRAFT:
        step: draft

# The summariser declares its data like any other step — here the finished
# article, pulled in with an { article: <slug> } ref.
summarize:
  llm:
    model: anthropic:claude-haiku-4-5
    prompt: |
      One friendly sentence for an activity feed: what shipped, according
      to these release notes. No preamble.

      {{NOTES}}
  env:
    NOTES:
      article: release-notes
