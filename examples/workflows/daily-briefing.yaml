# yaml-language-server: $schema=../.kiri/workflow.schema.json

name: Daily Briefing
steps:
  - sh: |
      set -eu
      for dep in curl jq; do
        command -v "$dep" >/dev/null 2>&1 || {
          echo "daily-briefing requires '$dep' on PATH" >&2
          exit 1
        }
      done

      hn_limit=30
      hn_ids=$(curl -fsSL "https://hacker-news.firebaseio.com/v0/beststories.json" \
        | jq -r ".[:${hn_limit}][]")

      printf '{"hackernews":['
      first=1
      for id in $hn_ids; do
        [ "$first" = 1 ] && first=0 || printf ','
        curl -fsSL "https://hacker-news.firebaseio.com/v0/item/${id}.json"
      done
      printf '],"devto":'

      curl -fsSL "https://dev.to/api/articles?per_page=30&top=1"
      printf '}'
    id: fetch
    name: Fetch news sources
    description: Fetch HackerNews best stories and Dev.to top articles

articles:
  - slug: briefing
    name: Daily Briefing
    description: Today's most important tech news, with a roundup and a thought to chew on.
    use: claude-code
    env:
      PROMPT_FILE: prompts/daily-briefing.tpl
      MODEL: haiku
      # The fetch step's stdout, resolved by kiri and rendered into the
      # prompt template as {{NEWS}}.
      NEWS:
        step: fetch

# The summariser takes the finished article through an { article: } ref
# and asks for the feed line directly.
summarize:
  llm:
    model: anthropic:claude-haiku-4-5
    prompt: |
      One sentence for an activity feed: today's top story from this
      briefing. No preamble.

      {{BRIEFING}}
  env:
    BRIEFING:
      article: briefing
